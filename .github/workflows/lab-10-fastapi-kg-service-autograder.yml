name: "Lab 10 — FastAPI + Next.js Recipe Service Autograder"

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testtest
          NEO4J_dbms_memory_heap_max__size: 1G
          NEO4J_dbms_memory_pagecache_size: 512M
        ports:
          - 7687:7687
          - 7474:7474

      weaviate:
        image: semitechnologies/weaviate:1.24.10
        env:
          QUERY_DEFAULTS_LIMIT: "20"
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: "none"
          PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
        ports:
          - 8080:8080

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testtest
      WEAVIATE_URL: http://localhost:8080
      WEB_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt PyYAML
          # Pin the spaCy model wheel directly — `python -m spacy download`
          # constructs a malformed URL on some spaCy/pip combinations
          # (.../download/-en_core_web_sm/-en_core_web_sm.tar.gz → 404).
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl

      - name: Wait for Neo4j
        shell: bash
        run: |
          for i in {1..60}; do
            if docker exec ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p testtest "RETURN 1;" >/dev/null 2>&1; then
              echo "Neo4j is ready"
              exit 0
            fi
            echo "Waiting for Neo4j..."
            sleep 2
          done

          echo "Neo4j did not become ready"
          docker logs ${{ job.services.neo4j.id }}
          exit 1

      - name: Wait for Weaviate
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/v1/.well-known/ready; then
              echo "Weaviate is ready"
              exit 0
            fi
            echo "Waiting for Weaviate..."
            sleep 2
          done

          echo "Weaviate did not become ready"
          docker logs ${{ job.services.weaviate.id }}
          exit 1

      - name: Backend autograder
        run: pytest tests/backend tests/frontend/test_compose.py tests/frontend/test_dockerfiles.py tests/frontend/test_typescript_interfaces.py -v --tb=short

  frontend:
    runs-on:ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: Build Next.js
        run: cd web && npm run build

      - name: Install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: cd web && npx playwright test

  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Backend Docker build
        # Repo-root context + explicit -f api/Dockerfile. The api/Dockerfile
        # COPYs api/requirements.txt and api/ into /app so the container can
        # run `uvicorn api.main:app` and the starter's package-relative
        # imports resolve. `docker build ./api` would set the build context
        # to api/, where neither path exists, and the build fails.
        run: docker build -t m10-api -f api/Dockerfile .

      - name: Frontend Docker build
        run: docker build -t m10-web ./web

      - name: Image sizes
        run: |
          docker images m10-api --format '{{.Size}}'
          docker images m10-web --format '{{.Size}}'
